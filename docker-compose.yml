services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - hf_cache:/app/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VI_HEAD_PATH: ${VI_HEAD_PATH:-}
      MODEL_DEVICE: cpu
      PRELOAD_MODELS: "true"
      OMP_NUM_THREADS: ${MODEL_CPU_THREADS:-2}
      MKL_NUM_THREADS: ${MODEL_CPU_THREADS:-2}
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache:

